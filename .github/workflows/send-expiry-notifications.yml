name: Send scheduled expiry notifications

on:
  schedule:
    # Daily at 09:00 in Brasília time (UTC-3); early morning across Brazilian time zones.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      confirm_send:
        description: "Confirm that real notification emails may be sent."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scheduled-expiry-notifications
  cancel-in-progress: false

jobs:
  send:
    if: ${{ (github.event_name == 'schedule' && vars.EXPIRY_ALERTS_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.confirm_send == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate notification secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPIRY_ALERTS_CRON_SECRET: ${{ secrets.EXPIRY_ALERTS_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::Missing SUPABASE_URL secret."; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::Missing SUPABASE_ANON_KEY secret."; exit 1; }
          test -n "$EXPIRY_ALERTS_CRON_SECRET" || { echo "::error::Missing EXPIRY_ALERTS_CRON_SECRET secret."; exit 1; }

      - name: Process expiry notification batches
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPIRY_ALERTS_CRON_SECRET: ${{ secrets.EXPIRY_ALERTS_CRON_SECRET }}
        run: |
          set -euo pipefail
          endpoint="${SUPABASE_URL%/}/functions/v1/send-expiry-notifications"
          offset=0

          for batch in $(seq 1 100); do
            request_body="$(jq -n --argjson batch_size 100 --argjson offset "$offset" '{batch_size:$batch_size,offset:$offset,dry_run:false}')"
            response="$(curl --silent --show-error --fail-with-body \
              --request POST "$endpoint" \
              --header "apikey: $SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
              --header "x-expiry-alert-secret: $EXPIRY_ALERTS_CRON_SECRET" \
              --header "Content-Type: application/json" \
              --data "$request_body")"

            echo "$response" | jq -c '{status,date,candidates,processed,sent,failed,skipped,uncertain,has_more}'
            if ! echo "$response" | jq -e '.status == "processed" and .failed == 0 and .uncertain == 0' >/dev/null; then
              echo "::error::Notification batch failed or requires manual reconciliation."
              exit 1
            fi
            has_more="$(echo "$response" | jq -r '.has_more // false')"
            if [ "$has_more" != "true" ]; then
              exit 0
            fi

            next_offset="$(echo "$response" | jq -r '.next_offset // empty')"
            if ! [[ "$next_offset" =~ ^[0-9]+$ ]] || [ "$next_offset" -le "$offset" ]; then
              echo "::error::Invalid notification batch cursor. Stopping to prevent an infinite loop."
              exit 1
            fi
            offset="$next_offset"
          done

          echo "::error::More than 10,000 notification deliveries remain. Increase the controlled batch window after reviewing provider limits."
          exit 1
