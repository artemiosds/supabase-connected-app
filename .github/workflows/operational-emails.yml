name: Operational email queue
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operational-emails
  cancel-in-progress: false
jobs:
  deliver:
    if: github.event_name == 'workflow_dispatch' || vars.OPERATIONAL_ALERTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: ${{ secrets.SUPABASE_URL }}
      KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SECRET: ${{ secrets.EXPIRY_ALERTS_CRON_SECRET }}
    steps:
      - name: Drain queue (manual runs are read-only)
        shell: bash
        run: |
          set -euo pipefail
          dry=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then dry=true; fi
          for batch in {1..40}; do
            result=$(curl -fsS --max-time 150 -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              -H "x-expiry-alert-secret: $SECRET" -H 'Content-Type: application/json' \
              --data "{\"channel\":\"operational\",\"dry_run\":$dry}" "${BASE%/}/functions/v1/send-expiry-notifications")
            jq -ec '{status,sent,skipped,failed,uncertain}' <<<"$result"
            jq -e '.failed == 0 and .uncertain == 0' <<<"$result" >/dev/null
            [[ $(jq -r '.has_more // false' <<<"$result") == true ]] || exit 0
          done
          exit 1
