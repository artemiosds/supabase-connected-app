name: Deploy Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase-migrations
  cancel-in-progress: false

jobs:
  validate-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_PORT: 55434
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate database connection secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || {
            echo "::error::Configure the SUPABASE_DB_URL GitHub repository secret before deploying migrations."
            exit 1
          }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Start disposable local Supabase
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if supabase start -x inbucket; then
              exit 0
            fi
            supabase stop --no-backup || true
            if [ "$attempt" -lt 3 ]; then
              echo "Supabase local startup failed; retrying in 20 seconds (attempt $((attempt + 1))/3)."
              sleep 20
            fi
          done
          echo "::error::Supabase could not start after three isolated attempts."
          exit 1

      - name: Validate all migrations and pgTAP security tests locally
        run: |
          set -euo pipefail
          supabase db reset --local
          supabase test db

      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup || true

      - name: Push pending migrations to SMS2
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --yes
