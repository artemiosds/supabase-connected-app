name: Validate application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run backup utility tests
        run: python -m unittest discover -s scripts -p "test_backup_supabase_storage.py" -v

      - name: Verify encrypted backup package roundtrip with synthetic fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          bash scripts/test_backup_encryption_roundtrip.sh

      - name: Run unit tests
        run: bun run test

      - name: Run native Bun unit tests
        run: bun test

      - name: Build production bundle
        run: bun run build

      - name: Type check
        run: bunx tsc --noEmit

      - name: Native TypeScript type check
        run: bunx --package @typescript/native-preview tsgo --noEmit

      - name: Lint
        run: bun run lint

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check Supabase Edge Functions
        run: |
          for function in supabase/functions/*/index.ts; do
            deno check --config supabase/functions/deno.json "$function"
          done

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: supabase-disposable-${{ github.ref }}
      cancel-in-progress: false
    env:
      # Avoid collisions with the runner's default local Postgres port.
      SUPABASE_DB_PORT: 55433
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Start local Supabase
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if supabase start -x inbucket; then
              exit 0
            fi
            supabase stop --no-backup || true
            if [ "$attempt" -lt 3 ]; then
              echo "Supabase image/network startup failed; retrying in 20 seconds (attempt $((attempt + 1))/3)."
              sleep 20
            fi
          done
          echo "::error::Supabase could not start after three isolated attempts."
          exit 1

      - name: Apply migrations to disposable local database
        run: supabase db reset --local

      - name: Run database security regression tests
        run: supabase test db

      - name: Verify encrypted synthetic backup restores into disposable PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age postgresql-client
          eval "$(supabase status -o env)"
          BACKUP_RESTORE_DATABASE_URL="$DB_URL" bash scripts/test_backup_encryption_roundtrip.sh
