name: Validate application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run backup utility tests
        run: python -m unittest discover -s scripts -p "test_backup_supabase_storage.py" -v

      - name: Run unit tests
        run: bun run test

      - name: Build production bundle
        run: bun run build

      - name: Type check
        run: bunx tsc --noEmit

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check Supabase Edge Functions
        run: |
          for function in supabase/functions/*/index.ts; do
            deno check "$function"
          done

      - name: Lint
        run: bun run lint

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Start local Supabase
        run: supabase start -x inbucket

      - name: Apply migrations to disposable local database
        run: supabase db reset --local

      - name: Run database security regression tests
        run: supabase test db
