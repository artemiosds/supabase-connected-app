name: Normalize Google Drive runbook formatting

on:
  push:
    branches:
      - feat/tenant-google-drive-oauth-foundation

permissions:
  contents: write

jobs:
  format-runbook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/tenant-google-drive-oauth-foundation
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format only the runbook with the locked Prettier version
        run: bunx prettier --write docs/CONFIGURACAO-GOOGLE-DRIVE.md

      - name: Commit formatting when needed
        run: |
          if git diff --quiet -- docs/CONFIGURACAO-GOOGLE-DRIVE.md; then
            echo "Runbook already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CONFIGURACAO-GOOGLE-DRIVE.md
          git commit -m "style: format Google Drive configuration runbook"
          git push origin HEAD:feat/tenant-google-drive-oauth-foundation
