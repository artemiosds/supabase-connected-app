name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Publish reviewed functions to SMS2 after homologation approval"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-supabase-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_deploy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::Configure the SUPABASE_ACCESS_TOKEN GitHub repository secret before deploying."
            exit 1
          }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Deploy invitation function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy invite-tenant-user --project-ref rwbbznqtocunzrpcvjvk

      - name: Deploy platform billing configuration function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy platform-billing-config --project-ref rwbbznqtocunzrpcvjvk

      - name: Deploy internal platform support invitation function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy invite-platform-support-agent --project-ref rwbbznqtocunzrpcvjvk

      - name: Deploy internal platform staff invitation function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy invite-platform-staff --project-ref rwbbznqtocunzrpcvjvk

      - name: Deploy scheduled expiry notification function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-expiry-notifications --project-ref rwbbznqtocunzrpcvjvk

      - name: Deploy tenant Google Drive OAuth function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy google-drive-oauth --project-ref rwbbznqtocunzrpcvjvk
