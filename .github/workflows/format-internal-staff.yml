name: Format internal staff branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.pull_request.head.ref == 'feat/platform-internal-staff-rbac' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Apply Prettier to changed files
        run: |
          bunx prettier --write \
            src/routes/admin-master.tsx \
            src/routes/_authenticated.tsx \
            src/routes/redefinir-senha.tsx \
            src/components/admin-master-support.tsx \
            src/components/admin-master-staff.tsx \
            src/components/platform-staff-workspace.tsx \
            src/hooks/use-platform-admin.tsx \
            src/integrations/supabase/types.ts \
            src/integrations/supabase/previewAuthStorage.ts \
            supabase/functions/invite-platform-support-agent/index.ts \
            supabase/functions/invite-platform-staff/index.ts \
            docs/IMPLANTACAO-EQUIPE-INTERNA.md \
            docs/IMPLANTACAO-EQUIPE-DE-SUPORTE.md
      - name: Commit formatted files back to the feature branch
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin-master.tsx src/routes/_authenticated.tsx src/routes/redefinir-senha.tsx src/components/admin-master-support.tsx src/components/admin-master-staff.tsx src/components/platform-staff-workspace.tsx src/hooks/use-platform-admin.tsx src/integrations/supabase/types.ts src/integrations/supabase/previewAuthStorage.ts supabase/functions/invite-platform-support-agent/index.ts supabase/functions/invite-platform-staff/index.ts docs/IMPLANTACAO-EQUIPE-INTERNA.md docs/IMPLANTACAO-EQUIPE-DE-SUPORTE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format internal staff delivery"
          git push origin "HEAD:${BRANCH_NAME}"
