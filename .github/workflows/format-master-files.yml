name: Format Master implementation files

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-master-files.yml"
      - "src/hooks/use-platform-admin.tsx"
      - "src/hooks/use-tenant.tsx"
      - "src/integrations/supabase/previewAuthStorage.ts"
      - "src/integrations/supabase/types.ts"
      - "src/lib/commercial-access.ts"
      - "src/routes/_authenticated.tsx"
      - "src/routes/_authenticated/documentos.tsx"
      - "src/routes/admin-master.tsx"
      - "src/test/commercial-access.test.ts"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format only scoped files
        run: |
          bunx prettier --write \
            src/hooks/use-platform-admin.tsx \
            src/hooks/use-tenant.tsx \
            src/integrations/supabase/previewAuthStorage.ts \
            src/integrations/supabase/types.ts \
            src/lib/commercial-access.ts \
            src/routes/_authenticated.tsx \
            src/routes/_authenticated/documentos.tsx \
            src/routes/admin-master.tsx \
            src/test/commercial-access.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/hooks/use-platform-admin.tsx \
            src/hooks/use-tenant.tsx \
            src/integrations/supabase/previewAuthStorage.ts \
            src/integrations/supabase/types.ts \
            src/lib/commercial-access.ts \
            src/routes/_authenticated.tsx \
            src/routes/_authenticated/documentos.tsx \
            src/routes/admin-master.tsx \
            src/test/commercial-access.test.ts
          git commit -m "style: format Master commercial implementation"
          git push
