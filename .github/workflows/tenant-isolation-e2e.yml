name: Authenticated tenant isolation E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tenant-isolation-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: supabase-disposable-${{ github.ref }}
      cancel-in-progress: false
    env:
      # Keep the local Supabase database away from the runner's default Postgres port.
      SUPABASE_DB_PORT: 55432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked application dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Start disposable local Supabase
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if supabase start -x inbucket; then
              exit 0
            fi
            supabase stop --no-backup || true
            if [ "$attempt" -lt 3 ]; then
              echo "Supabase image/network startup failed; retrying in 20 seconds (attempt $((attempt + 1))/3)."
              sleep 20
            fi
          done
          echo "::error::Supabase could not start after three isolated attempts."
          exit 1

      - name: Apply all migrations to the disposable database
        run: supabase db reset --local

      - name: Install pinned Playwright browser
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0
          npx playwright install chromium
          # Hosted runners already carry most browser libraries. Only reach
          # the apt mirrors when the actual Chromium launch requires them.
          probe='import { chromium } from "playwright"; const browser = await chromium.launch(); await browser.close();'
          if ! node --input-type=module -e "$probe"; then
            npx playwright install --with-deps chromium
            node --input-type=module -e "$probe"
          fi

      - name: Seed synthetic users and run authenticated browser isolation tests
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"

          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export VITE_SUPABASE_URL="$API_URL"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"

          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/e2e/seed-tenant-isolation.sql

          # Exercise the deployed handler logic against disposable local Supabase.
          # Only a synthetic cron secret is supplied; no Resend/provider settings
          # are present, and dry_run=true must guarantee zero email delivery.
          export EXPIRY_ALERTS_CRON_SECRET="gfs-e2e-local-only-secret-2026-11-13"
          edge_env_file="$(mktemp)"
          printf 'EXPIRY_ALERTS_CRON_SECRET=%s\n' "$EXPIRY_ALERTS_CRON_SECRET" > "$edge_env_file"
          printf 'APP_URL=http://127.0.0.1:4173\n' >> "$edge_env_file"

          supabase functions serve \
            --env-file "$edge_env_file" \
            > /tmp/gfs-expiry-functions.log 2>&1 &
          echo "$!" > /tmp/gfs-expiry-functions.pid

          for attempt in $(seq 1 60); do
            function_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:54321/functions/v1/send-expiry-notifications || true)"
            if [ "$function_status" = "405" ]; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/gfs-expiry-functions.log
              echo "::error::Expiry notification Edge Function did not become ready."
              exit 1
            fi
            sleep 2
          done

          # Homologate safe simulation against the disposable local database.
          # The script refuses non-loopback hosts and verifies both queues
          # remain byte-for-byte unchanged across repeated requests.
          DB_URL="$DB_URL" bash scripts/e2e/verify-expiry-dry-run.sh

          bun run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/gfs-vite.log 2>&1 &
          echo "$!" > /tmp/gfs-vite.pid

          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4173/entrar >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/gfs-vite.log
              echo "::error::Vite did not become ready."
              exit 1
            fi
            sleep 2
          done

          if ! E2E_APP_URL="http://127.0.0.1:4173" node scripts/e2e/tenant-isolation.browser.mjs; then
            auth_container_id="$(docker ps -aq --filter name=supabase_auth | head -n 1)"
            if [ -n "$auth_container_id" ]; then
              echo "::group::Supabase Auth diagnostics (filtered)"
              docker logs "$auth_container_id" 2>&1 | grep -Ei "error|fatal|panic|failed|identity|password|database" | tail -n 80 || true
              echo "::endgroup::"
            fi
            postgres_container_id="$(docker ps -aq --filter name=supabase_db | head -n 1)"
            if [ -n "$postgres_container_id" ]; then
              echo "::group::Postgres diagnostics (filtered)"
              docker logs "$postgres_container_id" 2>&1 | grep -Ei "ERROR|FATAL|PANIC|auth.users|auth.identities" | tail -n 80 || true
              echo "::endgroup::"
            fi
            exit 1
          fi

      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-isolation-e2e-failure-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload supplier homologation screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: supplier-homologation
          path: artifacts/supplier-*.png
          if-no-files-found: error
          retention-days: 14
