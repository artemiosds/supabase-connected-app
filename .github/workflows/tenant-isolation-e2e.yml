name: Authenticated tenant isolation E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tenant-isolation-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Keep the local Supabase database away from the runner's default Postgres port.
      SUPABASE_DB_PORT: 55432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked application dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Start disposable local Supabase
        run: supabase start -x inbucket

      - name: Apply all migrations to the disposable database
        run: supabase db reset --local

      - name: Install pinned Playwright browser
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0
          npx playwright install --with-deps chromium

      - name: Seed synthetic users and run authenticated browser isolation tests
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"

          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export VITE_SUPABASE_URL="$API_URL"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"

          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/e2e/seed-tenant-isolation.sql

          # Exercise the deployed handler logic against disposable local Supabase.
          # Only a synthetic cron secret is supplied; no Resend/provider settings
          # are present, and dry_run=true must guarantee zero email delivery.
          export EXPIRY_ALERTS_CRON_SECRET="gfs-e2e-local-only-secret-2026-11-13"
          edge_env_file="$(mktemp)"
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nEXPIRY_ALERTS_CRON_SECRET=%s\n' \
            "$API_URL" "$SERVICE_ROLE_KEY" "$EXPIRY_ALERTS_CRON_SECRET" > "$edge_env_file"

          supabase functions serve send-expiry-notifications \
            --no-verify-jwt \
            --env-file "$edge_env_file" \
            > /tmp/gfs-expiry-functions.log 2>&1 &
          echo "$!" > /tmp/gfs-expiry-functions.pid

          for attempt in $(seq 1 60); do
            function_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:54321/functions/v1/send-expiry-notifications || true)"
            if [ "$function_status" = "405" ]; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/gfs-expiry-functions.log
              echo "::error::Expiry notification Edge Function did not become ready."
              exit 1
            fi
            sleep 2
          done

          dry_run_response="$(curl --silent --show-error --fail-with-body \
            --request POST http://127.0.0.1:54321/functions/v1/send-expiry-notifications \
            --header "apikey: $ANON_KEY" \
            --header "Authorization: Bearer $ANON_KEY" \
            --header "x-expiry-alert-secret: $EXPIRY_ALERTS_CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{"dry_run":true,"batch_size":100,"offset":0}')"

          echo "$dry_run_response" | jq -c '{status,date,candidates,processed,sent,failed,skipped,uncertain}'
          if ! echo "$dry_run_response" | jq -e \
            '.status == "dry_run" and .sent == 0 and .failed == 0 and .uncertain == 0' >/dev/null; then
            cat /tmp/gfs-expiry-functions.log
            echo "::error::Expiry notification dry-run failed or attempted a delivery."
            exit 1
          fi

          bun run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/gfs-vite.log 2>&1 &
          echo "$!" > /tmp/gfs-vite.pid

          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4173/entrar >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/gfs-vite.log
              echo "::error::Vite did not become ready."
              exit 1
            fi
            sleep 2
          done

          if ! E2E_APP_URL="http://127.0.0.1:4173" node scripts/e2e/tenant-isolation.browser.mjs; then
            auth_container_id="$(docker ps -aq --filter name=supabase_auth | head -n 1)"
            if [ -n "$auth_container_id" ]; then
              echo "::group::Supabase Auth diagnostics (filtered)"
              docker logs "$auth_container_id" 2>&1 | grep -Ei "error|fatal|panic|failed|identity|password|database" | tail -n 80 || true
              echo "::endgroup::"
            fi
            postgres_container_id="$(docker ps -aq --filter name=supabase_db | head -n 1)"
            if [ -n "$postgres_container_id" ]; then
              echo "::group::Postgres diagnostics (filtered)"
              docker logs "$postgres_container_id" 2>&1 | grep -Ei "ERROR|FATAL|PANIC|auth.users|auth.identities" | tail -n 80 || true
              echo "::endgroup::"
            fi
            exit 1
          fi

      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-isolation-e2e-failure-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
