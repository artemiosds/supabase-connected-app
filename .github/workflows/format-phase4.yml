name: Format Phase 4 touched files

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: format-phase4-main
  cancel-in-progress: false

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format only Phase 4 touched files
        run: bunx prettier --write src/integrations/supabase/types.ts src/routes/_authenticated/documentos.tsx

      - name: Run unit tests
        run: bun run test

      - name: Build production bundle
        run: bun run build

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Commit formatting only
        run: |
          if git diff --quiet -- src/integrations/supabase/types.ts src/routes/_authenticated/documentos.tsx; then
            echo "The selected files already match Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/types.ts src/routes/_authenticated/documentos.tsx
          git commit -m "style(phase4): format generated types and document workflow"
          git push
