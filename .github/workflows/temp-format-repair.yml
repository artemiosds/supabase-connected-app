name: Temporary format repair

on:
  push:
    branches: [feat/integracoes-configuraveis-tenant]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/integracoes-configuraveis-tenant
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format the two generated files flagged by CI
        run: bunx prettier --write src/integrations/supabase/types.ts src/integrations/supabase/previewAuthStorage.ts
      - name: Commit formatting-only repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/types.ts src/integrations/supabase/previewAuthStorage.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: format generated Supabase client files"
            git push origin HEAD:feat/integracoes-configuraveis-tenant
          fi
