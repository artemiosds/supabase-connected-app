name: Format procurement module

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: format-procurement-main
  cancel-in-progress: false

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format procurement page only
        run: bunx prettier --write src/routes/_authenticated/processos.tsx

      - name: Run unit tests
        run: bun run test

      - name: Build production bundle
        run: bun run build

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Commit formatting only
        run: |
          if git diff --quiet -- src/routes/_authenticated/processos.tsx; then
            echo "The procurement page already matches Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/processos.tsx
          git commit -m "style(procurement): format structured procurement interface"
          git push
