name: Format procurement module

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: format-procurement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting without modifying files
        run: bunx prettier --check src/test/commercial-access.test.ts src/lib/cnpj.test.ts src/test/app-routing.test.tsx src/lib/contratacao.test.ts src/lib/contratacao.ts src/routes/_authenticated/contratos.tsx src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/form.tsx src/components/ui/navigation-menu.tsx src/components/ui/sidebar.tsx src/components/ui/toggle.tsx src/hooks/use-auth.tsx src/hooks/use-tenant.tsx src/routes/_authenticated/processos.tsx src/routes/_authenticated/usuarios.tsx src/routes/redefinir-senha.tsx src/routes/entrar.tsx supabase/functions/invite-tenant-user/index.ts src/components/admin-master-billing.tsx src/routes/admin-master.tsx supabase/functions/platform-billing-config/index.ts src/components/admin-master-support.tsx src/components/admin-master-staff.tsx src/components/platform-staff-workspace.tsx src/routes/_authenticated/suporte.tsx src/routes/_authenticated.tsx supabase/functions/invite-platform-support-agent/index.ts supabase/functions/invite-platform-staff/index.ts docs/IMPLANTACAO-EQUIPE-INTERNA.md docs/IMPLANTACAO-EQUIPE-DE-SUPORTE.md supabase/functions/send-expiry-notifications/index.ts supabase/functions/_shared/expiry-notification.ts src/lib/expiry-notification.test.ts src/routes/_authenticated/fornecedores.tsx src/components/contracts/contract-items-balance.tsx src/lib/contract-item-balance.ts src/lib/contract-item-balance.test.ts src/lib/csv-export.ts src/lib/csv-export.test.ts src/components/reports/report-export-actions.tsx src/lib/xlsx-export.ts src/lib/xlsx-export.test.ts src/routes/_authenticated/documentos.tsx src/lib/document-source.ts src/lib/document-source.test.ts src/lib/document-source-upload.ts src/lib/document-source-upload.test.ts

      - name: Emit formatter output for scoped GitHub code review
        if: always()
        run: |
          set -euo pipefail
          bunx prettier --write src/lib/my-tasks.ts src/lib/my-tasks.test.ts src/components/dashboard/my-tasks.tsx src/components/sino-alertas.tsx supabase/functions/tenant-integration-settings/index.ts supabase/functions/_shared/institutional-email.ts src/lib/institutional-email.test.ts src/lib/test-email-recipient.test.ts supabase/functions/_shared/tenant-smtp.ts supabase/functions/_shared/test-email.ts src/routes/_authenticated/painel.tsx >/dev/null
          echo "PRIMUS_FORMAT_MT_BEGIN"
          base64 -w0 src/lib/my-tasks.ts
          echo
          echo "PRIMUS_FORMAT_MT_END"
          echo "PRIMUS_FORMAT_MTT_BEGIN"
          base64 -w0 src/lib/my-tasks.test.ts
          echo
          echo "PRIMUS_FORMAT_MTT_END"
          echo "PRIMUS_FORMAT_MTC_BEGIN"
          base64 -w0 src/components/dashboard/my-tasks.tsx
          echo
          echo "PRIMUS_FORMAT_MTC_END"
          echo "PRIMUS_FORMAT_SINO_BEGIN"
          base64 -w0 src/components/sino-alertas.tsx
          echo
          echo "PRIMUS_FORMAT_SINO_END"
          echo "PRIMUS_FORMAT_SETTINGS_BEGIN"
          base64 -w0 supabase/functions/tenant-integration-settings/index.ts
          echo
          echo "PRIMUS_FORMAT_SETTINGS_END"
          echo "PRIMUS_FORMAT_INST_BEGIN"
          base64 -w0 supabase/functions/_shared/institutional-email.ts
          echo
          echo "PRIMUS_FORMAT_INST_END"
          echo "PRIMUS_FORMAT_INSTTEST_BEGIN"
          base64 -w0 src/lib/institutional-email.test.ts
          echo
          echo "PRIMUS_FORMAT_INSTTEST_END"
          echo "PRIMUS_FORMAT_RECIPTEST_BEGIN"
          base64 -w0 src/lib/test-email-recipient.test.ts
          echo
          echo "PRIMUS_FORMAT_RECIPTEST_END"
          echo "PRIMUS_FORMAT_SMTP_BEGIN"
          base64 -w0 supabase/functions/_shared/tenant-smtp.ts
          echo
          echo "PRIMUS_FORMAT_SMTP_END"
          echo "PRIMUS_FORMAT_TESTSHARED_BEGIN"
          base64 -w0 supabase/functions/_shared/test-email.ts
          echo
          echo "PRIMUS_FORMAT_TESTSHARED_END"
          echo "PRIMUS_FORMAT_PAINEL_BEGIN"
          base64 -w0 src/routes/_authenticated/painel.tsx
          echo
          echo "PRIMUS_FORMAT_PAINEL_END"
