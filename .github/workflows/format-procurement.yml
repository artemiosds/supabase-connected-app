name: Format procurement module

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: format-procurement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting without modifying files
        run: bunx prettier --check src/test/commercial-access.test.ts src/lib/cnpj.test.ts src/test/app-routing.test.tsx src/lib/contratacao.test.ts src/lib/contratacao.ts src/routes/_authenticated/contratos.tsx src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/form.tsx src/components/ui/navigation-menu.tsx src/components/ui/sidebar.tsx src/components/ui/toggle.tsx src/hooks/use-auth.tsx src/hooks/use-tenant.tsx src/integrations/supabase/types.ts src/integrations/supabase/previewAuthStorage.ts src/routes/_authenticated/processos.tsx src/routes/_authenticated/usuarios.tsx src/routes/redefinir-senha.tsx src/routes/entrar.tsx supabase/functions/invite-tenant-user/index.ts src/components/admin-master-billing.tsx src/routes/admin-master.tsx supabase/functions/platform-billing-config/index.ts src/components/admin-master-support.tsx src/components/admin-master-staff.tsx src/components/platform-staff-workspace.tsx src/routes/_authenticated/suporte.tsx src/routes/_authenticated.tsx supabase/functions/invite-platform-support-agent/index.ts supabase/functions/invite-platform-staff/index.ts docs/IMPLANTACAO-EQUIPE-INTERNA.md docs/IMPLANTACAO-EQUIPE-DE-SUPORTE.md supabase/functions/send-expiry-notifications/index.ts supabase/functions/_shared/expiry-notification.ts src/lib/expiry-notification.test.ts src/routes/_authenticated/fornecedores.tsx src/components/contracts/contract-items-balance.tsx src/lib/contract-item-balance.ts src/lib/contract-item-balance.test.ts src/lib/csv-export.ts src/lib/csv-export.test.ts src/components/reports/report-export-actions.tsx src/lib/xlsx-export.ts src/lib/xlsx-export.test.ts
