name: Format procurement module

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: format-procurement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format support feature files and push formatting commit
        if: github.event_name == 'pull_request'
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          bunx prettier --write src/components/admin-master-support.tsx src/routes/_authenticated/suporte.tsx src/routes/_authenticated.tsx src/routes/redefinir-senha.tsx supabase/functions/invite-platform-support-agent/index.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/admin-master-support.tsx src/routes/_authenticated/suporte.tsx src/routes/_authenticated.tsx src/routes/redefinir-senha.tsx supabase/functions/invite-platform-support-agent/index.ts
            git commit -m "style: format platform support implementation"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Check formatting without modifying files
        run: bunx prettier --check src/test/commercial-access.test.ts src/lib/cnpj.test.ts src/test/app-routing.test.tsx src/lib/contratacao.test.ts src/lib/contratacao.ts src/routes/_authenticated/contratos.tsx src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/form.tsx src/components/ui/navigation-menu.tsx src/components/ui/sidebar.tsx src/components/ui/toggle.tsx src/hooks/use-auth.tsx src/hooks/use-tenant.tsx src/integrations/supabase/types.ts src/integrations/supabase/previewAuthStorage.ts src/routes/_authenticated/processos.tsx src/routes/_authenticated/usuarios.tsx src/routes/redefinir-senha.tsx src/routes/entrar.tsx supabase/functions/invite-tenant-user/index.ts src/components/admin-master-billing.tsx src/routes/admin-master.tsx supabase/functions/platform-billing-config/index.ts
