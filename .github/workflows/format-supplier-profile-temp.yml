name: Temporary formatter for supplier 360 PR

on:
  push:
    branches:
      - feat/supplier-360-profile

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supplier-360-profile
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Format only the supplier profile changes
        run: |
          bunx prettier --write \
            src/routes/_authenticated/fornecedores.tsx \
            src/components/suppliers/supplier-profile.tsx \
            src/lib/supplier-profile.ts \
            src/lib/supplier-profile.test.ts \
            scripts/e2e/tenant-isolation.browser.mjs

      - name: Commit and push formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/routes/_authenticated/fornecedores.tsx \
              src/components/suppliers/supplier-profile.tsx \
              src/lib/supplier-profile.ts \
              src/lib/supplier-profile.test.ts \
              scripts/e2e/tenant-isolation.browser.mjs
            git commit -m "style: format supplier 360 profile"
            git push origin HEAD:feat/supplier-360-profile
          fi
